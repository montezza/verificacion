<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verificación de Certificado de Autenticidad</title>
<style>
:root{--bg:#f4f1ea;--panel:#fffdf9;--ink:#1c1c1c;--muted:#6f6a60;--line:#ddd6c8;--acc:#8c6c3a;--acc2:#6f5429;--ok:#255c3b;--ok-bg:#ebf5ee;--ok-bd:#b8dcc4;--bad:#8f2424;--bad-bg:#fdf0f0;--bad-bd:#e6b8b8}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:18px 14px 40px}
.wrap{width:100%;max-width:560px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px 20px;box-shadow:0 8px 28px rgba(34,28,18,.06);position:relative}
.card::before{content:"";position:absolute;inset:7px;border:1px solid #e6dfd1;border-radius:8px;pointer-events:none}
.inner{position:relative;z-index:1}
.eyebrow{text-align:center;font:700 10px/1.2 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin:0 0 6px}
h1{text-align:center;font:400 22px/1.2 Georgia,serif;letter-spacing:.03em;margin:0 0 2px}
.sub{text-align:center;font:italic 13px/1.3 Georgia,serif;color:var(--muted);margin:0 0 16px}
.divider{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 18px}
.divider span{height:1px;width:44px;background:var(--acc);opacity:.6}
.divider i{width:7px;height:7px;background:var(--acc);transform:rotate(45deg);display:block}
.badge{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:8px;font:700 12px/1.3 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;text-align:center;margin-bottom:18px}
.badge.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-bd)}
.badge.bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-bd)}
.badge.info{background:#f7f3ea;color:var(--acc2);border:1px solid #e4d8be}
.seal-box{display:flex;flex-direction:column;align-items:center;padding:18px 14px;margin:0 0 18px;background:#fcfaf4;border:1px solid #e7e0d2;border-radius:10px}
.seal-box svg{width:min(220px,64vw);height:auto;display:block;filter:drop-shadow(0 2px 6px rgba(28,28,28,.08))}
.seal-cap{margin-top:10px;font:700 11px/1 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.guide{margin:10px 0 0;font-size:13px;line-height:1.45;color:var(--muted);text-align:center;max-width:400px}
.title-block{text-align:center;margin:0 0 16px;padding-bottom:14px;border-bottom:1px solid #ebe4d6}
.work-title{font:italic 21px/1.25 Georgia,serif;margin:0 0 4px;color:var(--ink)}
.work-artist{font-size:14px;color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:1fr;gap:0;border-top:1px solid #ebe4d6}
.row{display:grid;grid-template-columns:145px 1fr;gap:10px;padding:9px 2px;border-bottom:1px solid #eee7da;align-items:baseline}
.lbl{font:700 10px/1.3 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.val{font-size:14px;color:var(--ink);word-break:break-word}
.val a{color:var(--acc2);text-decoration:none;border-bottom:1px solid rgba(140,108,58,.4)}
.val a:hover{border-bottom-color:var(--acc2)}
.msg{font-size:14px;line-height:1.55;color:var(--muted);text-align:center;margin:6px 0}
.manual-box{margin-top:16px;padding-top:14px;border-top:1px solid #ebe4d6}
.manual-box label{display:block;font:600 12px/1.3 system-ui,sans-serif;color:var(--muted);margin-bottom:8px;text-align:center}
.manual-row{display:flex;gap:8px}
.manual-row input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:13px;background:#fff;color:var(--ink)}
.manual-row input:focus{outline:2px solid rgba(140,108,58,.25);border-color:var(--acc)}
.manual-row button{padding:8px 14px;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:7px;font:600 13px/1 system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.manual-row button:hover{background:var(--acc2);border-color:var(--acc2)}
.foot{margin-top:16px;text-align:center;font-size:12px;color:var(--muted)}
@media (max-width:460px){
  .card{padding:20px 14px}
  .row{grid-template-columns:1fr;gap:2px}
  .manual-row{flex-direction:column}
}
</style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <div class="inner">
      <p class="eyebrow">Documentación Artística</p>
      <h1>VERIFICACIÓN DE AUTENTICIDAD</h1>
      <p class="sub">Certificate of Authenticity · Verifier</p>
      <div class="divider"><span></span><i></i><span></span></div>
      <div id="content"></div>
    </div>
  </section>
  <p class="foot">Registro y verificación documental de obra original.</p>
</main>

<script>
(function (root) {
  'use strict';
  var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  var SHA256_K = [
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
  ];

  function utf8Bytes(str) {
    var s = String(str == null ? '' : str), out = [];
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      if (c < 0x80) {
        out.push(c);
      } else if (c < 0x800) {
        out.push(0xc0 | (c >> 6), 0x80 | (c & 0x3f));
      } else if (c >= 0xd800 && c <= 0xdbff && i + 1 < s.length) {
        var c2 = s.charCodeAt(++i);
        var cp = 0x10000 + (((c & 0x3ff) << 10) | (c2 & 0x3ff));
        out.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 0x3f), 0x80 | ((cp >> 6) & 0x3f), 0x80 | (cp & 0x3f));
      } else {
        out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f));
      }
    }
    return out;
  }

  function sha256(str) {
    var msg = utf8Bytes(str);
    var bitLen = msg.length * 8;
    msg.push(0x80);
    while (msg.length % 64 !== 56) msg.push(0);
    var hiLen = Math.floor(bitLen / 0x100000000);
    var loLen = bitLen >>> 0;
    msg.push(
      (hiLen >>> 24) & 255, (hiLen >>> 16) & 255, (hiLen >>> 8) & 255, hiLen & 255,
      (loLen >>> 24) & 255, (loLen >>> 16) & 255, (loLen >>> 8) & 255, loLen & 255
    );
    var H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
    var w = new Array(64);
    for (var i = 0; i < msg.length; i += 64) {
      for (var t = 0; t < 16; t++) {
        var j = i + t * 4;
        w[t] = ((msg[j] << 24) | (msg[j + 1] << 16) | (msg[j + 2] << 8) | msg[j + 3]) >>> 0;
      }
      for (var t = 16; t < 64; t++) {
        var s0 = ((w[t - 15] >>> 7) | (w[t - 15] << 25)) ^ ((w[t - 15] >>> 18) | (w[t - 15] << 14)) ^ (w[t - 15] >>> 3);
        var s1 = ((w[t - 2] >>> 17) | (w[t - 2] << 15)) ^ ((w[t - 2] >>> 19) | (w[t - 2] << 13)) ^ (w[t - 2] >>> 10);
        w[t] = (w[t - 16] + s0 + w[t - 7] + s1) >>> 0;
      }
      var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for (var t = 0; t < 64; t++) {
        var S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
        var ch = (e & f) ^ ((~e) & g);
        var temp1 = (h + S1 + ch + SHA256_K[t] + w[t]) >>> 0;
        var S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
        var maj = (a & b) ^ (a & c) ^ (b & c);
        var temp2 = (S0 + maj) >>> 0;
        h = g; g = f; f = e; e = (d + temp1) >>> 0;
        d = c; c = b; b = a; a = (temp1 + temp2) >>> 0;
      }
      H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0;
      H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
      H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0;
      H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
    }
    var bytes = [], hex = '';
    for (var k = 0; k < 8; k++) {
      var v = H[k];
      for (var sh = 24; sh >= 0; sh -= 8) {
        var byte = (v >>> sh) & 255;
        bytes.push(byte);
        hex += (byte < 16 ? '0' : '') + byte.toString(16).toUpperCase();
      }
    }
    return { bytes: bytes, hex: hex };
  }

  function b64UrlToBytes(str) {
    if (!str || !/^[A-Za-z0-9\-_]+$/.test(str)) return null;
    var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
    var out = [], buf = 0, bits = 0;
    for (var i = 0; i < str.length; i++) {
      var idx = chars.indexOf(str.charAt(i));
      if (idx < 0) return null;
      buf = (buf << 6) | idx;
      bits += 6;
      if (bits >= 8) {
        bits -= 8;
        out.push((buf >> bits) & 255);
      }
    }
    return out;
  }

  function bytesToHex(bytes) {
    return bytes.map(function (b) { return (b < 16 ? '0' : '') + b.toString(16).toUpperCase(); }).join('');
  }

  function parseParams(raw) {
    var q = String(raw || '').replace(/^[#?]+/, '');
    var out = {};
    if (!q) return out;
    q.split('&').forEach(function (pair) {
      if (!pair) return;
      var eq = pair.indexOf('=');
      var k = eq >= 0 ? pair.slice(0, eq) : pair;
      var v = eq >= 0 ? pair.slice(eq + 1) : '';
      try { k = decodeURIComponent(k); } catch (e) {}
      try { v = decodeURIComponent(v.replace(/\+/g, ' ')); } catch (e) {}
      out[k] = v;
    });
    return out;
  }

  function verifyPayload(rawQuery) {
    var p = parseParams(rawQuery);
    var keys = Object.keys(p);
    if (!keys.length) return { status: 'empty', params: p };
    var bytes = b64UrlToBytes(p.h || '');
    if (!bytes || bytes.length !== 32 || !p.k) {
      return { status: 'invalid', params: p };
    }
    var hex = bytesToHex(bytes);
    var tagInput = [
      'COA-V1-TAG',
      p.c || '', p.t || '', p.a || '', p.y || '', p.e || '',
      p.m || '', p.s || '', p.d || '', p.f || '', p.w || '',
      hex
    ].join('|');
    var expectedK = sha256(tagInput).hex.slice(0, 12);
    if (String(p.k).toUpperCase() !== expectedK) {
      return { status: 'invalid', params: p };
    }
    return { status: 'valid', params: p, bytes: bytes, hex: hex };
  }

  function renderSealSVG(bytes) {
    var R = 13.5;
    var ACC = '#8c6c3a', INK = '#1c1c1c', SEAL_BG = '#faf7f0', ACC_SOFT = '#d6cab2';
    var elems = [];
    function f(n) { return Number(n).toFixed(3); }
    function polar(r, ang) { return [r * Math.cos(ang), r * Math.sin(ang)]; }
    function ptsAttr(pts) {
      return pts.map(function (pt) { return f(pt[0]) + ',' + f(pt[1]); }).join(' ');
    }
    function polyEl(pts, fill, stroke, sw) {
      var attrs = 'points="' + ptsAttr(pts) + '" fill="' + (fill || 'none') + '"';
      if (stroke) attrs += ' stroke="' + stroke + '" stroke-width="' + sw + '" stroke-linejoin="round"';
      elems.push('<polygon ' + attrs + '/>');
    }
    function circleEl(cx, cy, r, fill, stroke, sw) {
      var attrs = 'cx="' + f(cx) + '" cy="' + f(cy) + '" r="' + f(r) + '" fill="' + (fill || 'none') + '"';
      if (stroke) attrs += ' stroke="' + stroke + '" stroke-width="' + sw + '"';
      elems.push('<circle ' + attrs + '/>');
    }
    function rectEl(x, y, w, h, fill) {
      elems.push('<rect x="' + f(x) + '" y="' + f(y) + '" width="' + f(w) + '" height="' + f(h) + '" fill="' + fill + '"/>');
    }
    function lineEl(p0, p1, stroke, sw) {
      elems.push('<line x1="' + f(p0[0]) + '" y1="' + f(p0[1]) + '" x2="' + f(p1[0]) + '" y2="' + f(p1[1]) + '" stroke="' + stroke + '" stroke-width="' + sw + '"/>');
    }

    // 1. Base de lacre / medallón exterior lobulado
    var outerPts = [];
    for (var v = 0; v < 128; v++) {
      var th = (v / 128) * Math.PI * 2;
      outerPts.push(polar(R + 0.32 * Math.cos(32 * th), th));
    }
    polyEl(outerPts, SEAL_BG, ACC, '0.38');
    circleEl(0, 0, R - 0.8, 'none', ACC, '0.14');

    // 2. Corona exterior de 64 segmentos (bytes 0..7)
    var r1 = R - 1.15, r2 = R - 2.65, rMid = (r1 + r2) / 2;
    var bitStep = (Math.PI * 2) / 64, bitPad = bitStep * 0.1;
    for (var i = 0; i < 64; i++) {
      var bIdx = i >> 3;
      var bVal = bytes[bIdx];
      var bit = (bVal >> (7 - (i & 7))) & 1;
      var a0 = -Math.PI / 2 + i * bitStep + bitPad;
      var a1 = -Math.PI / 2 + (i + 1) * bitStep - bitPad;
      if (bit) {
        var pop = bVal ^ (bVal >> 4);
        pop = (pop ^ (pop >> 2)) ^ (pop >> 1);
        polyEl([polar(r2, a0), polar(r1, a0), polar(r1, a1), polar(r2, a1)], (pop & 1) ? INK : ACC);
      } else {
        var aM = (a0 + a1) / 2;
        lineEl(polar(rMid - 0.32, aM), polar(rMid + 0.32, aM), ACC_SOFT, '0.14');
      }
    }

    // 3. Anillo geoglífico intermedio (bytes 8..19)
    var r3 = R - 3.0, r4 = R - 5.5, rm = (r3 + r4) / 2;
    circleEl(0, 0, r3, 'none', ACC, '0.18');
    circleEl(0, 0, r4, 'none', ACC, '0.18');
    var secStep = (Math.PI * 2) / 16, secPad = secStep * 0.09;
    for (var k = 0; k < 16; k++) {
      var s0 = -Math.PI / 2 + k * secStep;
      var a0 = s0 + secPad, a1 = s0 + secStep - secPad, aM = (a0 + a1) / 2;
      var nib = (k & 1) ? (bytes[8 + (k >> 1)] & 15) : ((bytes[8 + (k >> 1)] >> 4) & 15);
      var extra = (bytes[16 + (k >> 2)] >> ((k & 3) * 2)) & 3;
      var col = (nib & 8) ? INK : ACC;
      var alt = (nib & 8) ? ACC : INK;
      var shape = nib & 3;
      var variant = (nib >> 2) & 1;
      var ri = r4 + 0.24, ro = r3 - 0.24;

      if (extra & 1) {
        lineEl(polar(r4, s0), polar(r3, s0), ACC_SOFT, '0.13');
      }

      if (shape === 0) {
        polyEl([polar(ri, a0), polar(ro, aM), polar(ri, a1), polar(rm - 0.22, aM)], col);
        if (variant) {
          var tip = polar(ri + 0.32, aM);
          circleEl(tip[0], tip[1], 0.22, alt);
        }
      } else if (shape === 1) {
        polyEl([polar(ro, a0), polar(ri, aM), polar(ro, a1), polar(rm + 0.22, aM)], col);
        if (variant) {
          var tip2 = polar(ro - 0.32, aM);
          circleEl(tip2[0], tip2[1], 0.22, alt);
        }
      } else if (shape === 2) {
        polyEl([polar(ro, aM), polar(rm, a1), polar(ri, aM), polar(rm, a0)], col);
        if (variant) {
          var aw = (a1 - a0) * 0.26;
          polyEl([polar(rm + 0.45, aM), polar(rm, aM + aw), polar(rm - 0.45, aM), polar(rm, aM - aw)], SEAL_BG);
        }
      } else {
        var b0 = a0 * 0.65 + a1 * 0.35, b1 = a0 * 0.35 + a1 * 0.65;
        polyEl([polar(ri, a0), polar(rm, a0), polar(ro, b0), polar(ro, b1), polar(rm, a1), polar(ri, a1)], col);
        if (variant) {
          polyEl([polar(ri + 0.25, b0), polar(rm - 0.15, aM), polar(ri + 0.25, b1)], SEAL_BG);
        }
      }

      if ((extra & 2) && shape !== 2) {
        var cap = polar(shape === 1 ? ri + 0.25 : ro - 0.25, aM);
        circleEl(cap[0], cap[1], 0.18, alt);
      }
    }

    // 4. Núcleo central: matriz geoglífica simétrica 5x5 (bytes 20..31)
    var r5 = R - 5.9;
    circleEl(0, 0, r5, SEAL_BG, ACC, '0.26');

    var gridSpan = r5 * 1.32, cell = gridSpan / 5;
    var gx0 = -gridSpan / 2, gy0 = -gridSpan / 2;

    function bitAt(bitIdx) {
      return (bytes[20 + (bitIdx >> 3)] >> (bitIdx & 7)) & 1;
    }
    function readBits(offset, count) {
      var val = 0;
      for (var b = 0; b < count; b++) val |= (bitAt(offset + b) << b);
      return val;
    }
    function drawCellGlyph(r, c, code) {
      var x = gx0 + c * cell, yCell = gy0 + r * cell;
      var xm = x + cell / 2, ym = yCell + cell / 2;
      var p = cell * 0.1, s = cell - 2 * p, hs = s / 2;
      var prim = (code >> 2) & 3;
      var mod1 = (code >> 4) & 1;
      var mod2 = (code >> 5) & 1;

      if (prim === 0) {
        rectEl(x + p, yCell + p, s, s, mod1 ? INK : ACC);
        if (mod2) {
          var is = s * 0.34;
          rectEl(xm - is / 2, ym - is / 2, is, is, SEAL_BG);
        }
      } else if (prim === 1) {
        polyEl([[xm, ym - hs], [xm + hs, ym], [xm, ym + hs], [xm - hs, ym]], mod1 ? ACC : INK);
        if (mod2) {
          var ds = hs * 0.42;
          polyEl([[xm, ym - ds], [xm + ds, ym], [xm, ym + ds], [xm - ds, ym]], SEAL_BG);
        }
      } else if (prim === 2) {
        var fillTri = mod1 ? INK : ACC;
        var dx = 2 - c, dy = 2 - r;
        if (Math.abs(dx) >= Math.abs(dy)) {
          if (dx > 0) polyEl([[xm - hs, ym - hs], [xm + hs, ym], [xm - hs, ym + hs]], fillTri);
          else polyEl([[xm + hs, ym - hs], [xm - hs, ym], [xm + hs, ym + hs]], fillTri);
        } else {
          if (dy > 0) polyEl([[xm - hs, ym - hs], [xm + hs, ym - hs], [xm, ym + hs]], fillTri);
          else polyEl([[xm - hs, ym + hs], [xm + hs, ym + hs], [xm, ym - hs]], fillTri);
        }
        if (mod2) circleEl(xm, ym, hs * 0.26, mod1 ? ACC : INK);
      } else {
        rectEl(x + p, yCell + p, s, s, mod1 ? ACC : INK);
        var hw = s * 0.54;
        rectEl(xm - hw / 2, ym - hw / 2, hw, hw, SEAL_BG);
        var pt = s * 0.24;
        rectEl(xm - pt / 2, ym - pt / 2, pt, pt, mod2 ? ACC : INK);
      }
    }

    var bitPtr = 0;
    for (var r = 0; r < 5; r++) {
      for (var c = 0; c < 3; c++) {
        if (r === 2 && c === 2) continue;
        var code = readBits(bitPtr, 6);
        bitPtr += 6;
        if ((code & 3) !== 0) {
          drawCellGlyph(r, c, code);
          if (c < 2) drawCellGlyph(r, 4 - c, code);
        }
      }
    }

    // Emblema central de anclaje en (2, 2)
    var b31 = bytes[31], b30hi = (bytes[30] >> 4) & 15;
    var cxMid = gx0 + 2.5 * cell, cyMid = gy0 + 2.5 * cell;
    var chs = cell * 0.44;
    polyEl([[cxMid, cyMid - chs], [cxMid + chs, cyMid], [cxMid, cyMid + chs], [cxMid - chs, cyMid]], (b31 & 1) ? INK : ACC);
    if (b31 & 4) {
      var arm = chs * 0.26;
      var armCol = (b31 & 1) ? ACC : INK;
      rectEl(cxMid - chs * 0.85, cyMid - arm, chs * 1.7, arm * 2, armCol);
      rectEl(cxMid - arm, cyMid - chs * 0.85, arm * 2, chs * 1.7, armCol);
    }
    var midD = chs * 0.56;
    polyEl([[cxMid, cyMid - midD], [cxMid + midD, cyMid], [cxMid, cyMid + midD], [cxMid - midD, cyMid]], SEAL_BG);
    var inD = chs * 0.3;
    var inCol = (b31 & 2) ? ACC : INK;
    if (b31 & 8) rectEl(cxMid - inD * 0.8, cyMid - inD * 0.8, inD * 1.6, inD * 1.6, inCol);
    else polyEl([[cxMid, cyMid - inD], [cxMid + inD, cyMid], [cxMid, cyMid + inD], [cxMid - inD, cyMid]], inCol);
    if (b30hi & 1) circleEl(0, 0, r5 - 0.5, 'none', ACC_SOFT, '0.14');

    return '<svg viewBox="-14.5 -14.5 29 29" role="img" aria-label="Sello de Autenticidad">' + elems.join('') + '</svg>';
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function fechaLarga(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    if (!m) return iso || '';
    return +m[3] + ' de ' + MESES[+m[2] - 1] + ' de ' + m[1];
  }

  function formatContact(raw) {
    var v = String(raw || '').trim();
    if (!v) return '';
    if (/^https?:\/\//i.test(v)) return '<a href="' + esc(v) + '" target="_blank" rel="noopener noreferrer">' + esc(v) + '</a>';
    if (/^www\./i.test(v)) return '<a href="https://' + esc(v) + '" target="_blank" rel="noopener noreferrer">' + esc(v) + '</a>';
    if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return '<a href="mailto:' + esc(v) + '">' + esc(v) + '</a>';
    return esc(v);
  }

  function renderUI() {
    var el = typeof document !== 'undefined' && document.getElementById('content');
    if (!el) return;
    var raw = (window.location.hash && window.location.hash.length > 1) ? window.location.hash : window.location.search;
    var res = verifyPayload(raw);

    if (res.status === 'empty') {
      el.innerHTML =
        '<div class="badge info">Esperando escaneo de certificado</div>' +
        '<p class="msg">Escanea con la cámara de tu teléfono el <b>Código QR</b> impreso en el Certificado de Autenticidad para validar el registro y comparar el <b>Sello de Obra</b>.</p>' +
        '<div class="manual-box">' +
          '<label for="manualQr">¿Sin conexión o deseas verificar un enlace manualmente?</label>' +
          '<div class="manual-row">' +
            '<input id="manualQr" type="text" placeholder="Pegue aquí el enlace o código leído del QR…">' +
            '<button id="btnManualVerify" type="button">Verificar</button>' +
          '</div>' +
        '</div>';
      var btn = document.getElementById('btnManualVerify');
      var inp = document.getElementById('manualQr');
      function submitManual() {
        var rawVal = (inp && inp.value || '').trim();
        if (!rawVal) return;
        var idxH = rawVal.indexOf('#');
        var idxQ = rawVal.indexOf('?');
        var frag = idxH >= 0 ? rawVal.slice(idxH + 1) : (idxQ >= 0 ? rawVal.slice(idxQ + 1) : rawVal);
        window.location.hash = frag;
      }
      if (btn) btn.onclick = submitManual;
      if (inp) inp.onkeydown = function (e) { if (e.key === 'Enter') submitManual(); };
      return;
    }

    if (res.status === 'invalid') {
      el.innerHTML =
        '<div class="badge bad">&#9888; ALERTA: ENLACE O DATOS ADULTERADOS</div>' +
        '<p class="msg">El código de validación no coincide con los datos contenidos en el enlace o la información está incompleta. No es posible acreditar este certificado.</p>';
      return;
    }

    var p = res.params;
    var rows = [
      ['N.º de Certificado (COA)', esc(p.c || '—')],
      ['Año de creación', esc(p.y || '')],
      ['Pieza / edición', esc(p.e || '')],
      ['Técnica', esc(p.m || '')],
      ['Soporte', esc(p.s || '')],
      ['Dimensiones', esc(p.d || '')],
      ['Fecha de emisión', esc(fechaLarga(p.f || ''))],
      ['Contacto oficial', formatContact(p.w)]
    ].filter(function (r) { return r[1]; });

    el.innerHTML =
      '<div class="badge ok">&#10004; CERTIFICADO VÁLIDO · SELLO AUTÉNTICO</div>' +
      '<div class="seal-box">' +
        renderSealSVG(res.bytes) +
        '<div class="seal-cap">Sello de Obra</div>' +
        '<p class="guide">Acerque su teléfono al Certificado de Autenticidad impreso y compruebe que el sello coincide exactamente con el de esta pantalla.</p>' +
      '</div>' +
      '<div class="title-block">' +
        '<h2 class="work-title">' + esc(p.t || 'Obra sin título') + '</h2>' +
        '<p class="work-artist">por ' + esc(p.a || '—') + '</p>' +
      '</div>' +
      '<div class="grid">' +
        rows.map(function (r) {
          return '<div class="row"><div class="lbl">' + r[0] + '</div><div class="val">' + r[1] + '</div></div>';
        }).join('') +
      '</div>';
  }

  var api = { sha256: sha256, b64UrlToBytes: b64UrlToBytes, parseParams: parseParams, verifyPayload: verifyPayload, renderSealSVG: renderSealSVG };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.CoaVerify = api;

  if (typeof window !== 'undefined' && typeof document !== 'undefined') {
    window.addEventListener('hashchange', renderUI);
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderUI);
    else renderUI();
  }
})(typeof window !== 'undefined' ? window : globalThis);
</script>
</body>
</html>
